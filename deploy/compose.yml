# Keel control plane. Written to /opt/keel/compose.yml by install.sh and run as
#   docker compose -p keel --env-file /opt/keel/.env -f /opt/keel/compose.yml up -d
# Workers (user services, keel-worker) are Swarm services, not part of this file.
# Convex and the dashboard bind KEEL_ADDR (the tailnet IP) only. The one public listener is
# `proxy`, and only for what someone exposed (docs/networking.md).

name: keel

services:
  backend:
    # Pinned: backend upgrades can migrate the database. Bump deliberately.
    image: ghcr.io/get-convex/convex-backend:5c7cb5bc7db457290f1769f95f1d1340912f7fd7
    restart: unless-stopped
    stop_signal: SIGINT
    stop_grace_period: 10s
    ports:
      - "${KEEL_ADDR:?}:3210:3210"
      - "${KEEL_ADDR:?}:3211:3211"
    volumes:
      - convex-data:/convex/data
      # "use node" actions (convex/swarm.ts) drive Swarm through the manager's socket.
      # Root-equivalent; see docs/workers.md, "How Convex reaches Docker".
      - /var/run/docker.sock:/var/run/docker.sock
      # keel-proxy's admin socket (convex/proxy.ts). Shared through this volume only.
      - proxy-admin:/run/keel-proxy
    environment:
      INSTANCE_NAME: keel
      INSTANCE_SECRET: ${INSTANCE_SECRET:?}
      CONVEX_CLOUD_ORIGIN: http://${KEEL_ADDR}:3210
      CONVEX_SITE_ORIGIN: http://${KEEL_ADDR}:3211
      DISABLE_METRICS_ENDPOINT: "true"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3210/version"]
      interval: 5s
      start_period: 10s

  web:
    image: ${KEEL_IMAGE_PREFIX:-ghcr.io/thallesp}/keel-web:${KEEL_VERSION:-latest}
    restart: unless-stopped
    ports:
      - "${KEEL_ADDR:?}:${KEEL_WEB_PORT:-80}:80"
    environment:
      KEEL_CONVEX_URL: http://${KEEL_ADDR}:3210
      KEEL_CONVEX_SITE_URL: http://${KEEL_ADDR}:3211
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1/"]
      interval: 5s
      start_period: 5s

  # Public edge: Caddy + caddy-l4 + apps/proxy. Configured by Convex through the admin socket;
  # HTTPS on 80/443 and every exposed TCP/UDP port. It sits on the Swarm overlay to dial
  # svc-<id>:<port>, and opens its listeners in the host's network namespace (CAP_SYS_ADMIN for
  # setns, the host's netns file below), so a new port needs no restart. No `ports:` on purpose.
  proxy:
    image: ${KEEL_IMAGE_PREFIX:-ghcr.io/thallesp}/keel-proxy:${KEEL_VERSION:-latest}
    restart: unless-stopped
    cap_add: [SYS_ADMIN]
    volumes:
      - /proc/1/ns/net:/run/hostns/net:ro
      - proxy-admin:/run/keel-proxy
      - proxy-data:/data # certificates and ACME accounts
      - proxy-config:/config # the last config Convex pushed (`caddy run --resume`)
    networks: [keel]
    healthcheck:
      test: ["CMD", "test", "-S", "/run/keel-proxy/admin.sock"]
      interval: 5s
      start_period: 5s

networks:
  # The Swarm overlay user services run on, created by scripts/bootstrap-swarm.sh.
  keel:
    external: true

volumes:
  convex-data:
  proxy-admin:
  proxy-data:
  proxy-config:

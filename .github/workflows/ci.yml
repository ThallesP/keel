name: ci

# Pull requests run this directly. Pushes to main and v* tags run it as the first job of
# images.yml, which publishes the image only when every job here passed.
on:
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  # The keel binary: one Go module at the repo root (serve, proxy, agent and the CLI). `./...`
  # stops at nested modules, so apps/proxy (Convex era) is not part of it.
  go:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - name: gofmt
        run: |
          # The root module's package directories only (gofmt alone would walk nested modules).
          dirs=$(go list -f '{{.Dir}}' ./...)
          # shellcheck disable=SC2086
          unformatted=$(gofmt -l $dirs)
          if [ -n "$unformatted" ]; then
            echo "Not gofmt-ed:"; echo "$unformatted"
            exit 1
          fi
      - run: go vet ./...
      - run: go test ./...
      - name: openapi.json is current
        run: |
          # The dashboard's hooks and the CLI are built against this file: a handler change must
          # come with `make openapi`.
          go run ./cmd/keel openapi > /tmp/openapi.json
          if ! diff -u openapi.json /tmp/openapi.json; then
            echo "openapi.json is stale: run make openapi and commit it"; exit 1
          fi

  # keel serve + keel agent in one test process against the runner's own fresh Swarm: deploy,
  # ship a variable change, stop, start, redeploy, delete (internal/serve/swarm_it_test.go).
  swarm:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - name: Swarm
        run: |
          docker swarm init --advertise-addr 127.0.0.1
          docker network create -d overlay --attachable --opt com.docker.network.driver.mtu=1200 keel
      - run: go test ./internal/serve -run SwarmIT -v -count=1 -timeout 15m
        env:
          KEEL_IT_DOCKER_HOST: unix:///var/run/docker.sock

  # The dashboard, embedded into the binary by the image build.
  web:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - run: bun install --frozen-lockfile
      - run: bun run check-types
        working-directory: packages/ui
      - run: bun run check-types
        working-directory: apps/web
      - run: bun run build
        working-directory: apps/web

  # Runs install.sh end to end on a fresh runner against the image built from this commit, twice:
  # the second run must be a no-op upgrade that keeps every secret and the data. Then over a
  # Convex-era data volume it cannot export: it must stop, or start empty when told to.
  install:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-buildx-action@v3
      - name: Build the image
        run: docker buildx build --load --build-arg VERSION=ci -t local/keel:ci .
      - name: Configure the installer for the local image
        run: |
          # Swarm will not advertise on loopback; use the runner's primary address.
          {
            echo "KEEL_ADDR=$(hostname -I | awk '{print $1}')"
            echo "KEEL_SRC=$PWD"
            echo "KEEL_IMAGE_PREFIX=local"
            echo "KEEL_VERSION=ci"
            echo "KEEL_PULL=0"
            echo "KEEL_JSON=1"
          } >> "$GITHUB_ENV"
      - run: sudo -E ./install.sh > first.json
      - name: The installer's JSON result
        run: |
          jq -e '.ok == true and .url == "http://" + env.KEEL_ADDR' first.json
          # Fields are only ever added: the Convex-era URLs stay, equal to url.
          jq -e '.apiUrl == .url and .convexUrl == .url and .convexSiteUrl == .url' first.json
          jq -e '.version == "ci" and .stateDir == "/opt/keel" and (.publicIp | type) == "string"' first.json
          jq -e '.convexImportNeeded == false and .convexImport == null and (.warnings | type) == "array"' first.json
      - name: Sign up and sign in against the installed control plane
        run: |
          site="http://$KEEL_ADDR"
          creds='"email":"ci@example.com","password":"correct-horse-battery"'
          post() { curl -fsS -X POST -H 'Content-Type: application/json' -H "Origin: $site" "$@"; }
          curl -fsS "$site/api/auth/sign-up-open" | jq -e '.open == true'
          # Sign-up sets the dashboard's cookie and returns the same session as a bearer token.
          post -c cookies.txt "$site/api/auth/sign-up" -d "{$creds,\"name\":\"CI\"}" | jq -e '.token | length > 0'
          curl -fsS -b cookies.txt "$site/api/me" | jq -e '.user.email == "ci@example.com"'
          token=$(post "$site/api/auth/sign-in" -d "{$creds}" | jq -r .token)
          curl -fsS -H "Authorization: Bearer $token" "$site/api/me" | jq -e '.user.email == "ci@example.com"'
          curl -fsS "$site/api/me" | jq -e '.user == null'
          # Once an account exists, sign-up is by invitation only.
          curl -fsS "$site/api/auth/sign-up-open" | jq -e '.open == false'
          ! post "$site/api/auth/sign-up" -d '{"email":"second@example.com","password":"correct-horse-battery","name":"Second"}'
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - name: keel CLI finds the install from the dashboard URL and logs in through an approved link
        run: |
          go build -o "$RUNNER_TEMP/keel" ./cmd/keel
          export KEEL_CONFIG_DIR="$RUNNER_TEMP/keel-config"
          keel() { "$RUNNER_TEMP/keel" "$@"; }
          site="http://$KEEL_ADDR"
          auth() { curl -fsS -H 'Content-Type: application/json' -H "Origin: $site" "$@"; }
          # No terminal: login returns at once with the link, and commands wait for the approval.
          keel login "$site" > pending.json
          jq -e '.ok and .status == "pending" and (.approvalUrl | startswith("http://" + env.KEEL_ADDR + "/device?user_code="))' pending.json
          code=$(jq -r .code pending.json)
          ! keel whoami > early.json
          jq -e '.code == "AUTHORIZATION_PENDING"' early.json
          # The human: signed in, opens the link (binds the code to them) and approves.
          token=$(auth -X POST "$site/api/auth/sign-in" -d '{"email":"ci@example.com","password":"correct-horse-battery"}' | jq -r .token)
          auth -H "Authorization: Bearer $token" "$site/api/auth/device?user_code=$code" | jq -e '.status == "pending"'
          auth -X POST -H "Authorization: Bearer $token" "$site/api/auth/device/approve" -d "{\"userCode\":\"$code\"}"
          # The next command finishes the login.
          keel whoami | jq -e '.ok and .user.email == "ci@example.com" and .url == "http://" + env.KEEL_ADDR'
          keel login | jq -e '.ok and .status == "loggedIn"'
      - name: keel CLI creates a project and stages a service in it, as an agent would
        run: |
          export KEEL_CONFIG_DIR="$RUNNER_TEMP/keel-config"
          keel() { "$RUNNER_TEMP/keel" "$@"; }
          # This account never opened the dashboard, so there is no organization yet: no projects,
          # and the first project create founds it.
          keel project list | jq -e '.ok and .projects == []'
          keel project create "CI App" --link | jq -e '.ok and .project.slug == "ci-app" and .project.environments[0].name == "production" and .url == "http://" + env.KEEL_ADDR + "/p/ci-app"'
          ! keel project create ci-app > taken.json
          jq -e '.code == "NAME_TAKEN"' taken.json
          keel service create api --image nginx:alpine --port 8080 --replicas 2 \
            | jq -e '.ok and .project.slug == "ci-app" and .service.staged and .service.port == 8080 and .service.replicas == 2'
          ! keel service create api --image nginx:alpine > taken.json
          jq -e '.code == "NAME_TAKEN"' taken.json
          keel var set api GREETING=hello | jq -e '.ok and .staged'
          keel status | jq -e '.pendingChanges == 1'
          # Deleting is immediate, so without a terminal it takes --yes.
          ! keel service delete api > unconfirmed.json
          jq -e '.code == "USAGE"' unconfirmed.json
          keel service delete api --yes | jq -e '.ok and .deleted'
          keel service list | jq -e '.services == []'
      - name: keel proxy answers serve on the shared admin socket, listens on nothing yet, and has no Docker socket
        run: |
          # The admin socket lives in the proxy-admin volume; read it from the host.
          sock="$(sudo docker volume inspect -f '{{.Mountpoint}}' keel_proxy-admin)/admin.sock"
          admin() { sudo curl -fsS --unix-socket "$sock" "http://proxy$1"; }
          admin /keel/host-addrs | jq -e 'type == "array" and length > 0'
          # serve synced it at start: nothing is exposed, so no app and no public listener.
          admin /config/ | jq -e '(.apps // {}) == {}'
          # The container that parses internet traffic never holds the Docker socket.
          proxy=$(sudo docker compose -p keel --env-file /opt/keel/.env -f /opt/keel/compose.yml ps -q proxy)
          mounts=$(sudo docker inspect -f '{{range .Mounts}}{{.Source}} {{end}}' "$proxy")
          echo "proxy mounts: $mounts"
          [[ -n "$mounts" && "$mounts" != *docker.sock* ]]
      - name: Re-run is idempotent and keeps the data
        run: |
          secrets() { sudo grep -E '^KEEL_WORKER_TOKEN=' /opt/keel/.env | sha256sum; }
          # A new install has no Convex-era secret.
          if sudo grep -qE '^(INSTANCE_SECRET|BETTER_AUTH_SECRET|CONVEX_SELF_HOSTED_ADMIN_KEY)=' /opt/keel/.env; then
            echo "a new install wrote a Convex-era secret"; exit 1
          fi
          before=$(secrets)
          sudo -E ./install.sh > second.json
          jq -e '.ok == true and .convexImportNeeded == false' second.json
          [ "$before" = "$(secrets)" ]
          # The account, the CLI's session and the project survive it.
          export KEEL_CONFIG_DIR="$RUNNER_TEMP/keel-config"
          "$RUNNER_TEMP/keel" whoami | jq -e '.ok and .user.email == "ci@example.com"'
          "$RUNNER_TEMP/keel" project list | jq -e '[.projects[].slug] == ["ci-app"]'
      - name: Over Convex-era data it imports or stops; KEEL_SKIP_CONVEX_IMPORT=1 starts empty knowingly
        run: |
          compose() { sudo docker compose -p keel --env-file /opt/keel/.env -f /opt/keel/compose.yml "$@"; }
          # Convex-era data and no SQLite database yet, but no old backend and no admin key to
          # export it with: the installer stops before starting anything.
          compose down
          sudo docker volume rm keel_keel-data
          sudo docker volume create keel_convex-data
          ! sudo -E ./install.sh > third.json
          jq -e '.ok == false and (.fix | contains("KEEL_SKIP_CONVEX_IMPORT=1"))' third.json
          [ -z "$(compose ps -q)" ]
          # Skipping knowingly starts empty, keeps the data, and says so.
          sudo -E KEEL_SKIP_CONVEX_IMPORT=1 ./install.sh > fourth.json
          jq -e '.ok and .convexImportNeeded and .convexImport == null and (.warnings | any(contains("keel_convex-data")))' fourth.json
          # Nothing imported and no account yet: every re-run says it again.
          sudo -E ./install.sh > fifth.json
          jq -e '.ok and .convexImportNeeded' fifth.json
          sudo docker volume inspect keel_convex-data > /dev/null
      - name: Diagnostics
        if: failure()
        run: |
          cat first.json second.json third.json fourth.json fifth.json 2>/dev/null || true
          sudo docker compose -p keel ps || true
          sudo docker compose -p keel logs --tail 200 || true
          sudo docker service ps keel-agent --no-trunc || true
          sudo docker service logs keel-agent --tail 100 || true
